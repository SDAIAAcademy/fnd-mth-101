<section>
<h2>Week 1: Vectors and similarity</h2>
<ol>
<li><p>Learners are vectors of (video minutes, quizzes). Learner K is (300, 2). Which is nearest to K by Euclidean distance: M (305, 9), N (330, 2) or P (290, 2)?</p><ul><li><b>A.</b> P, because it matches K exactly on quizzes</li><li><b>B.</b> N, because its only difference is in one coordinate</li><li><b>C.</b> M, at a distance of about 8.6</li><li><b>D.</b> None: minutes and quizzes cannot be combined in one distance</li></ul></li>
<li><p>A question vector q = (1, 1). Two help articles: A = (4, 4) and B = (1, 1.2). Which statement is right?</p><ul><li><b>A.</b> A is closer in direction, since q · A = 8 beats q · B = 2.2</li><li><b>B.</b> A and q differ in direction, since A is four times longer</li><li><b>C.</b> Both measures rank A first, so the choice never matters</li><li><b>D.</b> A has cosine 1 with q and B a little less; the dot product also rewards A's length</li></ul></li>
<li><p>A search over mean word vectors returns two articles with cosines 0.951 and 0.949 to a question. What is the soundest reading?</p><ul><li><b>A.</b> The scores barely differ; check whether a shared direction inflates every cosine before trusting the order</li><li><b>B.</b> Both are excellent matches, since a cosine above 0.9 means near-identical meaning</li><li><b>C.</b> The first article is clearly the better answer, since it scores higher</li><li><b>D.</b> There is a 95% chance that either article answers the question</li></ul></li>
<li><p>Two help articles are represented by the vectors a = (3, 4) and b = (4, 3). What is their cosine similarity?</p><ul><li><b>A.</b> 0.96</li><li><b>B.</b> 24</li><li><b>C.</b> 0.48</li><li><b>D.</b> 0.75</li></ul></li>
<li><p>Every article vector in a search index has a large shared component, and almost every pair of articles has a cosine near 0.85. What does subtracting the mean vector before comparing do?</p><ul><li><b>A.</b> It makes every vector length 1, so cosines become dot products</li><li><b>B.</b> It removes the direction every vector shares, so the cosine compares how articles differ</li><li><b>C.</b> It leaves the cosines unchanged, because cosine already ignores length</li><li><b>D.</b> It makes every cosine exactly 0</li></ul></li>
</ol>
</section>
<section>
<h2>Week 2: Matrices as maps, and their cost</h2>
<ol>
<li><p>Three vectors: a = (2, 0), b = (10, 1), c = (1, 1). Which pair has the largest cosine similarity?</p><ul><li><b>A.</b> a and b, because their dot product, 20, is the largest</li><li><b>B.</b> a and b, at a cosine of about 0.995</li><li><b>C.</b> a and c, because they have similar lengths</li><li><b>D.</b> b and c, because both have a second coordinate of 1</li></ul></li>
<li><p>A layer compares 12 queries with 30 keys, each vector of length 64. What is the shape of S = Q Kᵀ?</p><ul><li><b>A.</b> 30 × 12</li><li><b>B.</b> 12 × 64</li><li><b>C.</b> 12 × 30</li><li><b>D.</b> 64 × 64</li></ul></li>
<li><p>S doubles every vector's first coordinate; T turns the plane a quarter turn. You want one matrix that scales first, then turns. Which is it?</p><ul><li><b>A.</b> T S</li><li><b>B.</b> S T</li><li><b>C.</b> S + T</li><li><b>D.</b> S T or T S, which are equal</li></ul></li>
<li><p>Multiplying two 500 × 500 matrices takes 0.25 GFLOPs. About how many FLOPs does a 1,000 × 1,000 product take?</p><ul><li><b>A.</b> 0.5 GFLOPs</li><li><b>B.</b> 1 GFLOP</li><li><b>C.</b> 4 GFLOPs</li><li><b>D.</b> 2 GFLOPs</li></ul></li>
<li><p>Attention scores are the product Q Kᵀ, where Q and K are both 1,024 × 64. Counting a multiply and an add as two operations, about how many floating-point operations does it take?</p><ul><li><b>A.</b> About 67 million</li><li><b>B.</b> About 8.4 million</li><li><b>C.</b> About 134 million (2 × 1,024 × 1,024 × 64)</li><li><b>D.</b> About 1 million</li></ul></li>
<li><p>Compute A B for A = [[1, 2], [3, 4]] and B = [[0, 1], [1, 0]].</p><ul><li><b>A.</b> [[3, 4], [1, 2]]</li><li><b>B.</b> [[0, 2], [3, 0]]</li><li><b>C.</b> [[2, 1], [4, 3]]</li><li><b>D.</b> [[1, 3], [2, 4]]</li></ul></li>
<li><p>A and B are NumPy arrays of shape (3, 4). Which expression gives the 3 × 3 matrix of dot products between the rows of A and the rows of B?</p><ul><li><b>A.</b> A @ B</li><li><b>B.</b> A @ B.T</li><li><b>C.</b> A * B</li><li><b>D.</b> A.T @ B</li></ul></li>
</ol>
</section>
<section>
<h2>Week 3: Span, rank and linear systems</h2>
<ol>
<li><p>A is 100 × 2,000, B is 2,000 × 2,000 and x is a vector of length 2,000. You need A B x. Which order costs fewer FLOPs?</p><ul><li><b>A.</b> Either: the answer is the same, so the cost is the same</li><li><b>B.</b> (A B) x</li><li><b>C.</b> A (B x)</li><li><b>D.</b> Whichever order NumPy chooses, since it optimises the brackets</li></ul></li>
<li><p>A table has columns: price, tax (15% of price), price with tax, and a discount code that varies freely. What is its rank, if there are many rows?</p><ul><li><b>A.</b> 4</li><li><b>B.</b> 2</li><li><b>C.</b> 3</li><li><b>D.</b> 1</li></ul></li>
<li><p>Elimination on a 4 × 4 matrix finds no non-zero pivot in the third column, even after looking for a row to swap. What follows?</p><ul><li><b>A.</b> The computation needs more precision</li><li><b>B.</b> The system has exactly one solution, found by skipping the column</li><li><b>C.</b> The columns are dependent; the system has no solution or infinitely many</li><li><b>D.</b> The right-hand side b must be zero</li></ul></li>
<li><p>A 3 × 3 matrix has rows (1, 2, 3), (0, 1, 4) and (1, 3, 7). Does it have an inverse?</p><ul><li><b>A.</b> Yes: no row is all zeros</li><li><b>B.</b> Yes: no two rows are equal</li><li><b>C.</b> It depends on the vector b it is used with</li><li><b>D.</b> No: the third row is the sum of the first two</li></ul></li>
<li><p>A data analyst's feature matrix has five columns. Its singular values are 2951, 89.6, 32.9, 6.0 and 0. What does the zero tell her?</p><ul><li><b>A.</b> One column is an exact combination of the others, so the matrix has rank 4</li><li><b>B.</b> The fifth column is all zeros</li><li><b>C.</b> The fifth feature is unimportant for prediction</li><li><b>D.</b> The matrix has only four rows</li></ul></li>
<li><p>A least-squares fit fails with 'Singular matrix'. One column is total actions, which is the exact sum of three other columns. What fixes it?</p><ul><li><b>A.</b> Rescale every column to unit variance</li><li><b>B.</b> Add more rows of the same kind</li><li><b>C.</b> Switch to 32-bit floats</li><li><b>D.</b> Drop one of the dependent columns, so the remaining columns are independent</li></ul></li>
<li><p>What is the inverse of [[2, 1], [1, 1]]?</p><ul><li><b>A.</b> [[0.5, 1], [1, 1]]</li><li><b>B.</b> [[1, 1], [1, 2]]</li><li><b>C.</b> [[−1, 1], [1, −2]]</li><li><b>D.</b> [[1, −1], [−1, 2]]</li></ul></li>
</ol>
</section>
<section>
<h2>Week 4: Orthogonal projection and QR</h2>
<ol>
<li><p>A 1,000 × 6 table of features has rank 5. What can you conclude?</p><ul><li><b>A.</b> Five of the 1,000 rows are independent, the rest repeat them</li><li><b>B.</b> One column has missing values</li><li><b>C.</b> One column is a combination of the others; a model cannot separate all six effects</li><li><b>D.</b> The sixth column must be deleted</li></ul></li>
<li><p>Project b = (4, 2) onto the line through a = (1, 0). Which is the projection, and why?</p><ul><li><b>A.</b> (0, 2), the part along the second axis</li><li><b>B.</b> (4, 0), since b · a / a · a = 4</li><li><b>C.</b> (4), the number b · a</li><li><b>D.</b> (0.894, 0), the unit vector of b on the axis</li></ul></li>
<li><p>Your function returns Q (5 × 3) and R (3 × 3) for a 5 × 3 matrix A. Which set of checks is enough?</p><ul><li><b>A.</b> QᵀQ = I</li><li><b>B.</b> Q R = A</li><li><b>C.</b> Q equals np.linalg.qr(A)[0] entry by entry</li><li><b>D.</b> QᵀQ = I, Q R = A and R upper triangular</li></ul></li>
<li><p>For a QR of a feature matrix you measure max |QᵀQ − I| = 0.02. What is the soundest next step?</p><ul><li><b>A.</b> Suspect nearly dependent columns, check the condition number, and use a Householder QR</li><li><b>B.</b> Accept it: 0.02 is a small number</li><li><b>C.</b> Use fewer rows so the factorisation is faster and more accurate</li><li><b>D.</b> Normalise each column of Q again to length 1</li></ul></li>
<li><p>Project y = (2, 3) onto the line through u = (1, 1). What is the projection?</p><ul><li><b>A.</b> (5, 5)</li><li><b>B.</b> (−0.5, 0.5)</li><li><b>C.</b> (2, 3)</li><li><b>D.</b> (2.5, 2.5)</li></ul></li>
<li><p>On nearly dependent columns, modified Gram-Schmidt keeps Q as orthogonal as Householder QR does.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
<section>
<h2>Week 5: Least squares and conditioning</h2>
<ol>
<li><p>P projects onto the span of the columns of A, and r = v − P v. Which statement always holds?</p><ul><li><b>A.</b> ‖r‖ = ‖P v‖</li><li><b>B.</b> P has an inverse</li><li><b>C.</b> P r = r</li><li><b>D.</b> Aᵀ r = 0</li></ul></li>
<li><p>Two candidate fits for the same data. Fit F has residual (1, −2, 1) and fit G has residual (2, −1, −1). The columns of X are (1, 1, 1) and (−1, 0, 1). Which can be the least-squares fit?</p><ul><li><b>A.</b> G, because its residual is more even</li><li><b>B.</b> F, because its residual is orthogonal to both columns</li><li><b>C.</b> Both, since their residuals have the same length</li><li><b>D.</b> Neither, because neither residual is zero</li></ul></li>
<li><p>A fit has cond(X) = 10⁷. Refitting after rounding the data to four decimals changes two coefficients by 30% and the fitted values by 0.01%. What is the diagnosis?</p><ul><li><b>A.</b> The rounding was too coarse; the model is fine</li><li><b>B.</b> The model is stable, since its predictions hardly moved</li><li><b>C.</b> Ill-conditioned: nearly collinear columns; trust the fit, not those two coefficients</li><li><b>D.</b> Rank-deficient: one column must be removed before any fit</li></ul></li>
<li><p>A feature matrix has cond(X) = 10⁶ in float64. You need coefficients accurate to at least six digits. Which route?</p><ul><li><b>A.</b> The normal equations: they are fastest</li><li><b>B.</b> QR, which puts about 6 digits at risk and leaves about 10</li><li><b>C.</b> The normal equations in float32 to save memory</li><li><b>D.</b> Invert XᵀX and multiply by Xᵀy</li></ul></li>
<li><p>If cond(X) is 2,213, then cond(XᵀX) is about 4.9 million.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>Two features are nearly collinear. Refitting on a slightly different sample swings their coefficients from +0.4 to −1.3, yet the predictions barely change. What is happening?</p><ul><li><b>A.</b> The system is ill-conditioned: the data fix the sum of the two effects, not each one separately</li><li><b>B.</b> The solver has a bug</li><li><b>C.</b> The model needs more features</li><li><b>D.</b> The predictions must be wrong too</li></ul></li>
<li><p>In 64-bit arithmetic both QR and the normal equations give a coefficient of 0.4228. In 32-bit arithmetic the normal equations give 0.4308. What is the most likely cause?</p><ul><li><b>A.</b> The true coefficient is 0.4308 and 64-bit arithmetic hides it</li><li><b>B.</b> Rounding error amplified by the squared condition number of XᵀX</li><li><b>C.</b> A different random seed</li><li><b>D.</b> QR is only an approximation</li></ul></li>
<li><p>With X = Q R (Q has orthonormal columns, R is upper triangular), which system gives the least-squares coefficients β?</p><ul><li><b>A.</b> β = Qᵀ y</li><li><b>B.</b> Rᵀ β = Q y</li><li><b>C.</b> R β = Qᵀ y</li><li><b>D.</b> XᵀX β = Qᵀ y</li></ul></li>
<li><p>As two features become more collinear, the gap between the normal-equation and QR coefficients grows from 10⁻¹¹ to 10⁻⁶. Which explanation fits?</p><ul><li><b>A.</b> QR becomes less accurate than the normal equations</li><li><b>B.</b> It is random noise unrelated to the data</li><li><b>C.</b> Both methods are exact, so the gap is a printing artefact</li><li><b>D.</b> The normal equations' error grows with cond(X)², QR's only with cond(X)</li></ul></li>
<li><p>Which NumPy and SciPy code solves least squares through QR?</p><ul><li><b>A.</b> Q, R = np.linalg.qr(X); beta = scipy.linalg.solve_triangular(R, Q.T @ y)</li><li><b>B.</b> beta = np.linalg.solve(X.T @ X, X.T @ y)</li><li><b>C.</b> beta = np.linalg.inv(X) @ y</li><li><b>D.</b> Q, R = np.linalg.qr(X); beta = R @ Q.T @ y</li></ul></li>
</ol>
</section>
<section>
<h2>Week 6: Eigenvectors and link ranking</h2>
<ol>
<li><p>A model fitted by the normal equations and by QR gives coefficients that differ in the third significant digit. The residual norms agree to eight digits. What is the most likely cause?</p><ul><li><b>A.</b> Nearly collinear columns: cond(X) is high and the normal equations square it</li><li><b>B.</b> A bug in the QR routine of the library</li><li><b>C.</b> Nothing: equal residuals mean the coefficients must be equal too</li><li><b>D.</b> Too few rows; more data would make the methods agree</li></ul></li>
<li><p>A symmetric 3 × 3 matrix has eigenvalues 9, 4 and 0. Which statement is right?</p><ul><li><b>A.</b> Its diagonal entries are 9, 4 and 0</li><li><b>B.</b> It is invertible, because two eigenvalues are positive</li><li><b>C.</b> It has rank 2 and squashes one direction to zero</li><li><b>D.</b> Its eigenvectors have lengths 9, 4 and 0</li></ul></li>
<li><p>Four features of course pages have a covariance matrix with eigenvalues 30, 5, 1 and 0.5. What can you say?</p><ul><li><b>A.</b> All four features carry about the same information</li><li><b>B.</b> About 82% of the variance lies along one direction, a combination of the features</li><li><b>C.</b> The first feature explains 82% of the variance</li><li><b>D.</b> The fourth feature is an error and must be removed</li></ul></li>
<li><p>With damping d = 0.85, power iteration converges in about a hundred steps; at d = 0.99 it takes many more. Why?</p><ul><li><b>A.</b> A larger d removes pages from the graph</li><li><b>B.</b> A larger d makes the leading eigenvalue larger than 1</li><li><b>C.</b> A larger d needs a better starting vector</li><li><b>D.</b> The second-largest eigenvalue is at most d, so the error shrinks more slowly when d is near 1</li></ul></li>
<li><p>A covariance matrix of three features has eigenvalues 4.0, 0.9 and 0.1. What share of the variance lies along the first principal component?</p><ul><li><b>A.</b> 4.0%</li><li><b>B.</b> 80%</li><li><b>C.</b> 33%</li><li><b>D.</b> 98%</li></ul></li>
<li><p>In link ranking with damping, the second-largest eigenvalue has size 0.85. The error of power iteration therefore shrinks by about 0.85 at each step.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
<section>
<h2>Week 7: Singular values and low rank</h2>
<ol>
<li><p>You repeat x ← A x / ‖A x‖ for a symmetric A with eigenvalues 7, 3 and −2, from a random start. What does x approach?</p><ul><li><b>A.</b> The eigenvector of −2</li><li><b>B.</b> The eigenvector of 7, up to sign</li><li><b>C.</b> An average of the three eigenvectors</li><li><b>D.</b> Nothing: dividing by the norm each step prevents convergence</li></ul></li>
<li><p>A 500 × 40 feature matrix has singular values 310, 52, 9, … , 0.004, 0.000002. What does that tell you?</p><ul><li><b>A.</b> All 40 directions are equally informative</li><li><b>B.</b> The condition number is 310</li><li><b>C.</b> Full rank but nearly rank-deficient: cond ≈ 1.6 × 10⁸, unsafe for the normal equations</li><li><b>D.</b> The rank is 3</li></ul></li>
<li><p>A matrix has singular values 10, 6, 3 and 1. What is ‖A − A₂‖_F, the error of its best rank-2 approximation?</p><ul><li><b>A.</b> 3</li><li><b>B.</b> 4</li><li><b>C.</b> √136 ≈ 11.66</li><li><b>D.</b> √10 ≈ 3.16</li></ul></li>
<li><p>A colleague takes the SVD of a ratings matrix without centring it. The first singular value is huge and the first right singular vector has nearly equal entries. What happened?</p><ul><li><b>A.</b> The first layer captures the average rating, not a pattern of variation</li><li><b>B.</b> Every item is rated the same by every person</li><li><b>C.</b> The matrix has rank 1</li><li><b>D.</b> The SVD routine has failed</li></ul></li>
<li><p>The search lead wants to store a ratings matrix at low rank and asks how much error each rank would leave. Which quantity answers that directly?</p><ul><li><b>A.</b> The rank of the matrix</li><li><b>B.</b> The determinant of the matrix</li><li><b>C.</b> The singular values after the k-th: their squares sum to the squared error of the best rank-k copy</li><li><b>D.</b> The largest eigenvalue of the covariance matrix</li></ul></li>
<li><p>What are the singular values of the diagonal matrix [[3, 0], [0, −4]]?</p><ul><li><b>A.</b> 4 and 3</li><li><b>B.</b> 3 and −4</li><li><b>C.</b> −4 and 3</li><li><b>D.</b> 7 and 1</li></ul></li>
<li><p>A matrix has singular values 10, 6, 3 and 1. What is the relative error ‖A − A₂‖_F / ‖A‖_F of its best rank-2 copy?</p><ul><li><b>A.</b> About 0.07</li><li><b>B.</b> About 0.26</li><li><b>C.</b> 0.20</li><li><b>D.</b> 0.30</li></ul></li>
<li><p>A rank-k copy of a 512 × 512 image stores k (512 + 512 + 1) numbers. From which rank does it stop saving space?</p><ul><li><b>A.</b> 512</li><li><b>B.</b> 128</li><li><b>C.</b> 256</li><li><b>D.</b> 262</li></ul></li>
<li><p>The first two principal components of the 8 × 8 handwritten digits hold about 28% of the variance, so a two-dimensional scatter of the digits leaves most of their spread out.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
<section>
<h2>Week 8: Low rank in practice, and working numerically</h2>
<ol>
<li><p>A 600 × 400 image has singular values that fall slowly: rank 300 still leaves 5% relative error. What should you conclude?</p><ul><li><b>A.</b> A rank-300 copy is a good way to save space</li><li><b>B.</b> The SVD was computed wrongly</li><li><b>C.</b> This image has little low-rank structure; truncation is a poor compressor for it</li><li><b>D.</b> Centring the image would make rank 10 enough</li></ul></li>
<li><p>Held-out errors for ranks 1 to 6 of a film-ratings model: 0.91, 0.86, 0.84, 0.85, 0.87, 0.90. Training errors fall from 0.88 to 0.61. Which rank?</p><ul><li><b>A.</b> 6, with the lowest training error</li><li><b>B.</b> 3, with the lowest held-out error</li><li><b>C.</b> 1, the simplest model</li><li><b>D.</b> 4, the middle of the range</li></ul></li>
<li><p>X has shape (100, 5). What does X - X.mean(axis=0) do?</p><ul><li><b>A.</b> Subtracts each row's mean from that row</li><li><b>B.</b> Raises a shape error</li><li><b>C.</b> Subtracts one overall mean from every entry</li><li><b>D.</b> Subtracts each column's mean from that column</li></ul></li>
<li><p>A test asserts Q.T @ Q == np.eye(3) for a correct QR and fails. What is wrong?</p><ul><li><b>A.</b> Exact equality on floats: compare with a tolerance instead</li><li><b>B.</b> The QR routine has a bug</li><li><b>C.</b> The product should be Q @ Q.T</li><li><b>D.</b> Convert Q to float32 first</li></ul></li>
<li><p>On held-out ratings, the error of a low-rank model is lowest at rank 3 and rises at higher ranks. Why?</p><ul><li><b>A.</b> The SVD becomes inaccurate at high rank</li><li><b>B.</b> Higher ranks are always better, so the code has a bug</li><li><b>C.</b> The baseline was computed wrongly</li><li><b>D.</b> Higher ranks fit the noise in the observed ratings, which does not carry over to new ones</li></ul></li>
<li><p>A low-rank adapter replaces a full update of a 768 × 768 weight matrix by two factors of rank 8. What share of the full update's parameters does it train?</p><ul><li><b>A.</b> About 2.1%</li><li><b>B.</b> About 1.0%</li><li><b>C.</b> About 8%</li><li><b>D.</b> 100%</li></ul></li>
</ol>
</section>

sions":[{"n":1,"label":"Session 1","title":"Orthogonal projection and QR"}]},{"n":5,"id":"week5","label":"Week 5","title":"Least squares and conditioning","sessions":[{"n":1,"label":"Session 1","title":"Least squares and conditioning"}]},{"n":6,"id":"week6","label":"Week 6","title":"Eigenvectors and link ranking","sessions":[{"n":1,"label":"Session 1","title":"Eigenvectors and link ranking"}]},{"n":7,"id":"week7","label":"Week 7","title":"Singular values and low rank","sessions":[{"n":1,"label":"Session 1","title":"The SVD and principal components"}]},{"n":8,"id":"week8","label":"Week 8","title":"Low rank in practice, and working numerically","sessions":[{"n":1,"label":"Session 1","title":"Low rank in practice"}]},{"n":9,"id":"capstone","label":"Capstone","title":"Capstone oral checks","sessions":[]}]},"ai":{"context":{"course":"context/course.md","courseJs":"context/course.js","day":null,"llms":"llms.txt"},"tasks":[],"tools":[]},"features":{},"strings":{},"questions":[{"id":"check-norm-units-q1","type":"single","prompt":"Learners are vectors of (video minutes, quizzes). Learner K is (300, 2). Which is nearest to K by Euclidean distance: M (305, 9), N (330, 2) or P (290, 2)?","options":[{"key":"A","text":"P, because it matches K exactly on quizzes"},{"key":"B","text":"N, because its only difference is in one coordinate"},{"key":"C","text":"M, at a distance of about 8.6"},{"key":"D","text":"None: minutes and quizzes cannot be combined in one distance"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"M: √(5² + 7²) ≈ 8.6; P: 10; N: 30. M wins although it took seven more quizzes, because one quiz counts as much as one minute here. Whether that is sensible is a scaling decision.","misconceptions":["Takes a perfect match on one coordinate as closeness: P is still 10 minutes away, more than M's distance","Counts how many coordinates differ instead of how far: N's one difference is 30 minutes, the largest gap of the three","","Believes a distance cannot be computed across units: it can, but its meaning depends on the scales chosen"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"week1","id":"check-norm-units","title":"Which learner is nearest?"},"level":null,"pool":"checkpoint"},{"id":"check-dot-or-cosine-q1","type":"single","prompt":"A question vector q = (1, 1). Two help articles: A = (4, 4) and B = (1, 1.2). Which statement is right?","options":[{"key":"A","text":"A is closer in direction, since q · A = 8 beats q · B = 2.2"},{"key":"B","text":"A and q differ in direction, since A is four times longer"},{"key":"C","text":"Both measures rank A first, so the choice never matters"},{"key":"D","text":"A has cosine 1 with q and B a little less; the dot product also rewards A's length"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A = 4q, so cos(q, A) = 1; B is slightly off q's direction. Both measures put A first here, for different reasons.","misconceptions":["Takes the larger dot product as the closer direction: A wins on dot product only because it is longer","Treats different lengths as different directions: A is exactly four times q","Assumes cosine and dot product always rank the same way: they agree only when all vectors have equal length",""],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"week1","id":"check-dot-or-cosine","title":"Dot product or cosine?"},"level":null,"pool":"checkpoint"},{"id":"check-high-dim-q1","type":"single","prompt":"A search over mean word vectors returns two articles with cosines 0.951 and 0.949 to a question. What is the soundest reading?","options":[{"key":"A","text":"The scores barely differ; check whether a shared direction inflates every cosine before trusting the order"},{"key":"B","text":"Both are excellent matches, since a cosine above 0.9 means near-identical meaning"},{"key":"C","text":"The first article is clearly the better answer, since it scores higher"},{"key":"D","text":"There is a 95% chance that either article answers the question"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"High, nearly equal cosines are what a shared direction produces. Centring the vectors and comparing again shows whether the order means anything.","misconceptions":["","Reads a high cosine as a strong match: when all vectors share a direction, every cosine is high","Treats a small gap in a high-dimensional score as a clear ranking: distances concentrate","Confuses cosine with a probability: a cosine is an angle measure, not a chance"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"week1","id":"check-high-dim","title":"Reading a search score"},"level":null,"pool":"checkpoint"},{"id":"review-week1-q1","type":"single","prompt":"Three vectors: a = (2, 0), b = (10, 1), c = (1, 1). Which pair has the largest cosine similarity?","options":[{"key":"A","text":"a and b, because their dot product, 20, is the largest"},{"key":"B","text":"a and b, at a cosine of about 0.995"},{"key":"C","text":"a and c, because they have similar lengths"},{"key":"D","text":"b and c, because both have a second coordinate of 1"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"cos(a, b) = 20 / (2 × 10.05) ≈ 0.995; cos(a, c) ≈ 0.707; cos(b, c) = 11 / (10.05 × 1.414) ≈ 0.774.","misconceptions":["Ranks by dot product, which rewards b's length: a · b = 20 is large only because b is long","","Assumes vectors of similar length are similar in direction: c is at 45° from a","Reads the shared second coordinate as shared direction: b points mostly along the first axis"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"week2","id":"review-week1","title":"Which pair is most similar by cosine?"},"level":null,"pool":"checkpoint"},{"id":"check-attention-shape-q1","type":"single","prompt":"A layer compares 12 queries with 30 keys, each vector of length 64. What is the shape of S = Q Kᵀ?","options":[{"key":"A","text":"30 × 12"},{"key":"B","text":"12 × 64"},{"key":"C","text":"12 × 30"},{"key":"D","text":"64 × 64"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Q is 12 × 64 and Kᵀ is 64 × 30; the inner 64 is summed in each dot product, leaving one score per query and key.","misconceptions":["Multiplies in the wrong order: K Qᵀ would be 30 × 12","Keeps the vector length as a dimension: the dot product sums it away","","Thinks a product keeps the inner size: in (12 × 64)(64 × 30) the 64 disappears"],"lo":["LO1"],"day":2,"session":1,"slide":{"deck":"week2","id":"check-attention-shape","title":"The shape of the scores"},"level":null,"pool":"checkpoint"},{"id":"check-composition-q1","type":"single","prompt":"S doubles every vector's first coordinate; T turns the plane a quarter turn. You want one matrix that scales first, then turns. Which is it?","options":[{"key":"A","text":"T S"},{"key":"B","text":"S T"},{"key":"C","text":"S + T"},{"key":"D","text":"S T or T S, which are equal"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"(T S) x = T (S x): S acts on x first, then T acts on the result.","misconceptions":["","Reads a product left to right like a sentence: the right-hand matrix acts first","Adds maps instead of composing them: S + T is neither map","Thinks the order of matrices never changes the result: here S T and T S differ"],"lo":["LO1"],"day":2,"session":1,"slide":{"deck":"week2","id":"check-composition","title":"Which matrix does \"scale, then turn\"?"},"level":null,"pool":"checkpoint"},{"id":"check-flops-q1","type":"single","prompt":"Multiplying two 500 × 500 matrices takes 0.25 GFLOPs. About how many FLOPs does a 1,000 × 1,000 product take?","options":[{"key":"A","text":"0.5 GFLOPs"},{"key":"B","text":"1 GFLOP"},{"key":"C","text":"4 GFLOPs"},{"key":"D","text":"2 GFLOPs"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"2n³: doubling n multiplies n³ by 8, and 8 × 0.25 = 2.","misconceptions":["Scales the cost with n: the cost grows with n³","Scales the cost with the number of entries, n²: each entry also grows longer","Scales with n⁴, counting the entries twice",""],"lo":["LO4"],"day":2,"session":1,"slide":{"deck":"week2","id":"check-flops","title":"How much does doubling the size cost?"},"level":null,"pool":"checkpoint"},{"id":"review-week2-q1","type":"single","prompt":"A is 100 × 2,000, B is 2,000 × 2,000 and x is a vector of length 2,000. You need A B x. Which order costs fewer FLOPs?","options":[{"key":"A","text":"Either: the answer is the same, so the cost is the same"},{"key":"B","text":"(A B) x"},{"key":"C","text":"A (B x)"},{"key":"D","text":"Whichever order NumPy chooses, since it optimises the brackets"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"B x costs 8 million FLOPs and A(Bx) 0.4 million more; (A B) alone costs 800 million.","misconceptions":["Thinks the cost is fixed by the result: the result is the same, the work is not","Multiplies the matrices first by habit: (A B) costs 2·100·2,000·2,000 = 800 million FLOPs","","Believes a library reorders the brackets for you: NumPy computes them in the order written"],"lo":["LO4"],"day":3,"session":null,"slide":{"deck":"week3","id":"review-week2","title":"Cheaper brackets"},"level":null,"pool":"checkpoint"},{"id":"check-rank-q1","type":"single","prompt":"A table has columns: price, tax (15% of price), price with tax, and a discount code that varies freely. What is its rank, if there are many rows?","options":[{"key":"A","text":"4"},{"key":"B","text":"2"},{"key":"C","text":"3"},{"key":"D","text":"1"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Tax = 0.15 × price and price with tax = 1.15 × price: both lie on price's direction. Price and the discount code are independent.","misconceptions":["Counts columns, not independent columns: tax and price with tax follow from price","","Misses that tax depends on price: only price with tax repeats the others","Thinks a column computed from another removes both: price still carries its own direction"],"lo":["LO2"],"day":3,"session":1,"slide":{"deck":"week3","id":"check-rank","title":"How many features are really there?"},"level":null,"pool":"checkpoint"},{"id":"check-systems-q1","type":"single","prompt":"Elimination on a 4 × 4 matrix finds no non-zero pivot in the third column, even after looking for a row to swap. What follows?","options":[{"key":"A","text":"The computation needs more precision"},{"key":"B","text":"The system has exactly one solution, found by skipping the column"},{"key":"C","text":"The columns are dependent; the system has no solution or infinitely many"},{"key":"D","text":"The right-hand side b must be zero"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A missing pivot means a column is a combination of earlier ones: rank below 4, a singular matrix.","misconceptions":["Believes a bigger computer fixes it: the zero is structural, not a rounding accident","Assumes a solution exists and is unique: a dependent column removes uniqueness","","Confuses a zero pivot with a zero right-hand side: b plays no part in the pivots"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"week3","id":"check-systems","title":"What does a zero pivot tell you?"},"level":null,"pool":"checkpoint"},{"id":"check-inverse-q1","type":"single","prompt":"A 3 × 3 matrix has rows (1, 2, 3), (0, 1, 4) and (1, 3, 7). Does it have an inverse?","options":[{"key":"A","text":"Yes: no row is all zeros"},{"key":"B","text":"Yes: no two rows are equal"},{"key":"C","text":"It depends on the vector b it is used with"},{"key":"D","text":"No: the third row is the sum of the first two"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"(1, 2, 3) + (0, 1, 4) = (1, 3, 7). Rank 2: the map squashes a direction, so it cannot be undone.","misconceptions":["Thinks a matrix with no zero row is invertible: rows can depend on each other without being zero","Looks only for equal rows: dependence can be any combination","Thinks invertibility depends on the right-hand side: it is a property of the matrix alone",""],"lo":["LO2"],"day":3,"session":1,"slide":{"deck":"week3","id":"check-inverse","title":"Can this table be inverted?"},"level":null,"pool":"checkpoint"},{"id":"review-week3-q1","type":"single","prompt":"A 1,000 × 6 table of features has rank 5. What can you conclude?","options":[{"key":"A","text":"Five of the 1,000 rows are independent, the rest repeat them"},{"key":"B","text":"One column has missing values"},{"key":"C","text":"One column is a combination of the others; a model cannot separate all six effects"},{"key":"D","text":"The sixth column must be deleted"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Six columns but only five independent directions: some non-zero combination of columns is zero.","misconceptions":["Thinks rank counts rows: it is at most the smaller of rows and columns, here 6","Thinks a lower rank means a missing value: rank is about combinations, not gaps","","Thinks the last column is the culprit: any one of the dependent columns could be removed"],"lo":["LO2"],"day":4,"session":null,"slide":{"deck":"week4","id":"review-week3","title":"Reading a rank"},"level":null,"pool":"checkpoint"},{"id":"check-projection-q1","type":"single","prompt":"Project b = (4, 2) onto the line through a = (1, 0). Which is the projection, and why?","options":[{"key":"A","text":"(0, 2), the part along the second axis"},{"key":"B","text":"(4, 0), since b · a / a · a = 4"},{"key":"C","text":"(4), the number b · a"},{"key":"D","text":"(0.894, 0), the unit vector of b on the axis"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"b · a = 4 and a · a = 1, so p = 4a = (4, 0); the residual (0, 2) is orthogonal to the line.","misconceptions":["Projects onto the other axis: the line through (1, 0) is the first axis","","Returns the coefficient as if it were the point: 4 is a length along a, the point is 4a","Normalises b instead of projecting it: the projection keeps the shadow's length"],"lo":["LO1"],"day":4,"session":1,"slide":{"deck":"week4","id":"check-projection","title":"Where does the projection land?"},"level":null,"pool":"checkpoint"},{"id":"check-qr-q1","type":"single","prompt":"Your function returns Q (5 × 3) and R (3 × 3) for a 5 × 3 matrix A. Which set of checks is enough?","options":[{"key":"A","text":"QᵀQ = I"},{"key":"B","text":"Q R = A"},{"key":"C","text":"Q equals np.linalg.qr(A)[0] entry by entry"},{"key":"D","text":"QᵀQ = I, Q R = A and R upper triangular"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Together they define a QR factorisation; each alone admits wrong answers.","misconceptions":["Checks only one of the two properties: an orthonormal Q of the wrong span passes","Checks the product only: Q R = A also holds for Q = A and R = I","Compares with the library entry by entry: correct factorisations can differ in sign",""],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"week4","id":"check-qr","title":"Which check proves your QR is right?"},"level":null,"pool":"checkpoint"},{"id":"check-rounding-q1","type":"single","prompt":"For a QR of a feature matrix you measure max |QᵀQ − I| = 0.02. What is the soundest next step?","options":[{"key":"A","text":"Suspect nearly dependent columns, check the condition number, and use a Householder QR"},{"key":"B","text":"Accept it: 0.02 is a small number"},{"key":"C","text":"Use fewer rows so the factorisation is faster and more accurate"},{"key":"D","text":"Normalise each column of Q again to length 1"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A loss of 0.02 is about 10¹⁴ times rounding level: the columns are nearly dependent, and the method in use (typically classical Gram-Schmidt) does not keep Q orthonormal.","misconceptions":["","Treats 0.02 as negligible: in float64 a sound Q is within about 1e-15","Blames the size of the data: orthogonality loss comes from the angles between columns","Thinks normalising fixes orthogonality: unit length says nothing about the angles between columns"],"lo":["LO3"],"day":4,"session":1,"slide":{"deck":"week4","id":"check-rounding","title":"A measured loss of orthogonality"},"level":null,"pool":"checkpoint"},{"id":"review-week4-q1","type":"single","prompt":"P projects onto the span of the columns of A, and r = v − P v. Which statement always holds?","options":[{"key":"A","text":"‖r‖ = ‖P v‖"},{"key":"B","text":"P has an inverse"},{"key":"C","text":"P r = r"},{"key":"D","text":"Aᵀ r = 0"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The residual of an orthogonal projection is orthogonal to every column; in fact P r = 0.","misconceptions":["Confuses orthogonal with equal length: the residual can be any length","Thinks a projection matrix is invertible: it squashes the orthogonal directions to zero","Applies P to the residual and expects r back: the residual has no part in the subspace",""],"lo":["LO1"],"day":5,"session":null,"slide":{"deck":"week5","id":"review-week4","title":"A property of every projection"},"level":null,"pool":"checkpoint"},{"id":"check-least-squares-q1","type":"single","prompt":"Two candidate fits for the same data. Fit F has residual (1, −2, 1) and fit G has residual (2, −1, −1). The columns of X are (1, 1, 1) and (−1, 0, 1). Which can be the least-squares fit?","options":[{"key":"A","text":"G, because its residual is more even"},{"key":"B","text":"F, because its residual is orthogonal to both columns"},{"key":"C","text":"Both, since their residuals have the same length"},{"key":"D","text":"Neither, because neither residual is zero"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"F: sums to 0 and (1, −2, 1) · (−1, 0, 1) = 0. G: (2, −1, −1) · (−1, 0, 1) = −3, not orthogonal.","misconceptions":["Judges a residual by how even its entries look: what decides is orthogonality to the columns","","Thinks equal norms mean both are optimal: the least-squares residual is unique","Believes a non-zero residual means no fit is least squares: least squares rarely reaches zero"],"lo":["LO5"],"day":5,"session":1,"slide":{"deck":"week5","id":"check-least-squares","title":"Which fit is the least-squares fit?"},"level":null,"pool":"checkpoint"},{"id":"check-conditioning-q1","type":"single","prompt":"A fit has cond(X) = 10⁷. Refitting after rounding the data to four decimals changes two coefficients by 30% and the fitted values by 0.01%. What is the diagnosis?","options":[{"key":"A","text":"The rounding was too coarse; the model is fine"},{"key":"B","text":"The model is stable, since its predictions hardly moved"},{"key":"C","text":"Ill-conditioned: nearly collinear columns; trust the fit, not those two coefficients"},{"key":"D","text":"Rank-deficient: one column must be removed before any fit"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Full rank, high condition number, stable predictions, unstable coefficients: the pattern of near-collinearity.","misconceptions":["Blames the rounding: rounding only revealed a sensitivity that was already there","Reads stable predictions as stable coefficients: the two can differ","","Calls any large condition number rank-deficient: the rank is still full"],"lo":["LO3"],"day":5,"session":1,"slide":{"deck":"week5","id":"check-conditioning","title":"Diagnose a fit"},"level":null,"pool":"checkpoint"},{"id":"check-route-q1","type":"single","prompt":"A feature matrix has cond(X) = 10⁶ in float64. You need coefficients accurate to at least six digits. Which route?","options":[{"key":"A","text":"The normal equations: they are fastest"},{"key":"B","text":"QR, which puts about 6 digits at risk and leaves about 10"},{"key":"C","text":"The normal equations in float32 to save memory"},{"key":"D","text":"Invert XᵀX and multiply by Xᵀy"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"QR works with cond(X) = 10⁶: about 16 − 6 = 10 digits remain.","misconceptions":["Ignores the squaring: cond(XᵀX) = 10¹² leaves about 4 digits","","Thinks float32 speeds things up harmlessly: it carries only about 7 digits","Inverts XᵀX instead of solving: the conditioning is the same or worse"],"lo":["LO5"],"day":5,"session":1,"slide":{"deck":"week5","id":"check-route","title":"Which route for this fit?"},"level":null,"pool":"checkpoint"},{"id":"review-week5-q1","type":"single","prompt":"A model fitted by the normal equations and by QR gives coefficients that differ in the third significant digit. The residual norms agree to eight digits. What is the most likely cause?","options":[{"key":"A","text":"Nearly collinear columns: cond(X) is high and the normal equations square it"},{"key":"B","text":"A bug in the QR routine of the library"},{"key":"C","text":"Nothing: equal residuals mean the coefficients must be equal too"},{"key":"D","text":"Too few rows; more data would make the methods agree"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Stable residuals with unstable coefficients is the signature of near-collinearity, amplified by forming XᵀX.","misconceptions":["","Blames the solver for a bug: two correct methods disagree exactly where the problem is ill-conditioned","Thinks equal residuals prove equal coefficients: many β give nearly the same fit","Takes the sample size as the cause: conditioning is about the columns' angles"],"lo":["LO5"],"day":6,"session":null,"slide":{"deck":"week6","id":"review-week5","title":"Normal equations or QR?"},"level":null,"pool":"checkpoint"},{"id":"check-eigen-q1","type":"single","prompt":"A symmetric 3 × 3 matrix has eigenvalues 9, 4 and 0. Which statement is right?","options":[{"key":"A","text":"Its diagonal entries are 9, 4 and 0"},{"key":"B","text":"It is invertible, because two eigenvalues are positive"},{"key":"C","text":"It has rank 2 and squashes one direction to zero"},{"key":"D","text":"Its eigenvectors have lengths 9, 4 and 0"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A v = 0 for the eigenvector of 0: that direction is lost, so the rank is 2 and there is no inverse.","misconceptions":["Thinks eigenvalues are diagonal entries: they are only for a diagonal matrix","Believes a zero eigenvalue only means a small entry: it means a direction sent to zero","","Confuses symmetric with orthogonal: an orthogonal matrix keeps lengths, eigenvalues of size 1"],"lo":["LO2"],"day":6,"session":1,"slide":{"deck":"week6","id":"check-eigen","title":"Reading eigenvalues"},"level":null,"pool":"checkpoint"},{"id":"check-pca-q1","type":"single","prompt":"Four features of course pages have a covariance matrix with eigenvalues 30, 5, 1 and 0.5. What can you say?","options":[{"key":"A","text":"All four features carry about the same information"},{"key":"B","text":"About 82% of the variance lies along one direction, a combination of the features"},{"key":"C","text":"The first feature explains 82% of the variance"},{"key":"D","text":"The fourth feature is an error and must be removed"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"30 / (30 + 5 + 1 + 0.5) ≈ 0.82, along the leading eigenvector, which mixes the features.","misconceptions":["Equates the number of eigenvalues with the number of useful features: the spread is uneven","","Thinks a component is one of the original features: it is a combination of all four","Reads the smallest eigenvalue as an error: a small variance is still variance"],"lo":["LO2"],"day":6,"session":1,"slide":{"deck":"week6","id":"check-pca","title":"What does the first component tell you?"},"level":null,"pool":"checkpoint"},{"id":"check-power-q1","type":"single","prompt":"With damping d = 0.85, power iteration converges in about a hundred steps; at d = 0.99 it takes many more. Why?","options":[{"key":"A","text":"A larger d removes pages from the graph"},{"key":"B","text":"A larger d makes the leading eigenvalue larger than 1"},{"key":"C","text":"A larger d needs a better starting vector"},{"key":"D","text":"The second-largest eigenvalue is at most d, so the error shrinks more slowly when d is near 1"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The error shrinks by about |λ₂| per step, and |λ₂| ≤ d: 0.99 shrinks it by only 1% a step.","misconceptions":["Thinks larger d means fewer pages: the graph is the same","Thinks the leading eigenvalue changes: it stays exactly 1","Thinks convergence depends on the starting vector only: the eigenvalue gap governs it",""],"lo":["LO2"],"day":6,"session":1,"slide":{"deck":"week6","id":"check-power","title":"Why does damping speed up convergence?"},"level":null,"pool":"checkpoint"},{"id":"review-week6-q1","type":"single","prompt":"You repeat x ← A x / ‖A x‖ for a symmetric A with eigenvalues 7, 3 and −2, from a random start. What does x approach?","options":[{"key":"A","text":"The eigenvector of −2"},{"key":"B","text":"The eigenvector of 7, up to sign"},{"key":"C","text":"An average of the three eigenvectors"},{"key":"D","text":"Nothing: dividing by the norm each step prevents convergence"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The part along the eigenvector of 7 grows by 7 each step, the others by at most 3: the ratio 3/7 shrinks them away.","misconceptions":["Picks the eigenvalue with the largest index: power iteration picks the largest size","","Thinks the iteration averages the eigenvectors: the largest one outgrows the rest","Thinks normalising stops convergence: it only keeps the numbers in range"],"lo":["LO2"],"day":7,"session":null,"slide":{"deck":"week7","id":"review-week6","title":"What does power iteration converge to?"},"level":null,"pool":"checkpoint"},{"id":"check-svd-q1","type":"single","prompt":"A 500 × 40 feature matrix has singular values 310, 52, 9, … , 0.004, 0.000002. What does that tell you?","options":[{"key":"A","text":"All 40 directions are equally informative"},{"key":"B","text":"The condition number is 310"},{"key":"C","text":"Full rank but nearly rank-deficient: cond ≈ 1.6 × 10⁸, unsafe for the normal equations"},{"key":"D","text":"The rank is 3"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"310 / 0.000002 = 1.55 × 10⁸; squared, it reaches the limit of float64.","misconceptions":["Treats every non-zero σ as equally important: tiny ones are close to dependence","Reads the largest σ as the condition number: it is the ratio of largest to smallest","","Counts only σ above 1 as the rank: rank counts all non-zero values"],"lo":["LO2"],"day":7,"session":1,"slide":{"deck":"week7","id":"check-svd","title":"Reading singular values"},"level":null,"pool":"checkpoint"},{"id":"check-low-rank-q1","type":"single","prompt":"A matrix has singular values 10, 6, 3 and 1. What is ‖A − A₂‖_F, the error of its best rank-2 approximation?","options":[{"key":"A","text":"3"},{"key":"B","text":"4"},{"key":"C","text":"√136 ≈ 11.66"},{"key":"D","text":"√10 ≈ 3.16"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"√(3² + 1²) = √10: the square root of the sum of the squares of the dropped singular values.","misconceptions":["Takes the next singular value alone: the Frobenius error includes every dropped one","Adds the dropped values without squaring: the Frobenius norm adds squares","Uses the kept values instead of the dropped ones",""],"lo":["LO6"],"day":7,"session":1,"slide":{"deck":"week7","id":"check-low-rank","title":"Predict the error before computing it"},"level":null,"pool":"checkpoint"},{"id":"check-pca-svd-q1","type":"single","prompt":"A colleague takes the SVD of a ratings matrix without centring it. The first singular value is huge and the first right singular vector has nearly equal entries. What happened?","options":[{"key":"A","text":"The first layer captures the average rating, not a pattern of variation"},{"key":"B","text":"Every item is rated the same by every person"},{"key":"C","text":"The matrix has rank 1"},{"key":"D","text":"The SVD routine has failed"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Without centring, the mean is the largest common direction; PCA needs the spread around the mean.","misconceptions":["","Thinks equal entries mean the items are identical: they share a mean, not a pattern","Thinks a large σ₁ means the matrix has rank 1: other σ can still be large","Blames the library: the SVD of an uncentred matrix is correct, just answering another question"],"lo":["LO6"],"day":7,"session":1,"slide":{"deck":"week7","id":"check-pca-svd","title":"A component that points at the mean"},"level":null,"pool":"checkpoint"},{"id":"review-week7-q1","type":"single","prompt":"A 600 × 400 image has singular values that fall slowly: rank 300 still leaves 5% relative error. What should you conclude?","options":[{"key":"A","text":"A rank-300 copy is a good way to save space"},{"key":"B","text":"The SVD was computed wrongly"},{"key":"C","text":"This image has little low-rank structure; truncation is a poor compressor for it"},{"key":"D","text":"Centring the image would make rank 10 enough"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Storage k(m + n + 1) exceeds m n from k = 240, and the error is still 5%: the singular values decide.","misconceptions":["Assumes any truncation saves space: a rank-300 copy stores 300 × 1,001 numbers, more than 240,000","Thinks the SVD failed: slow decay is a property of the image","","Thinks centring always makes a matrix low-rank: it removes one layer at most"],"lo":["LO6"],"day":8,"session":null,"slide":{"deck":"week8","id":"review-week7","title":"Choosing a rank for an image"},"level":null,"pool":"checkpoint"},{"id":"check-rank-choice-q1","type":"single","prompt":"Held-out errors for ranks 1 to 6 of a film-ratings model: 0.91, 0.86, 0.84, 0.85, 0.87, 0.90. Training errors fall from 0.88 to 0.61. Which rank?","options":[{"key":"A","text":"6, with the lowest training error"},{"key":"B","text":"3, with the lowest held-out error"},{"key":"C","text":"1, the simplest model"},{"key":"D","text":"4, the middle of the range"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Held-out error is lowest at rank 3 and rises after: later layers fit noise.","misconceptions":["Chooses by training error, which always favours the largest rank","","Picks the smallest model by habit: rank 1 is clearly worse on held-out data","Averages ranks instead of comparing errors: the average has no meaning here"],"lo":["LO6"],"day":8,"session":1,"slide":{"deck":"week8","id":"check-rank-choice","title":"Which rank would you report?"},"level":null,"pool":"checkpoint"},{"id":"check-broadcast-q1","type":"single","prompt":"X has shape (100, 5). What does X - X.mean(axis=0) do?","options":[{"key":"A","text":"Subtracts each row's mean from that row"},{"key":"B","text":"Raises a shape error"},{"key":"C","text":"Subtracts one overall mean from every entry"},{"key":"D","text":"Subtracts each column's mean from that column"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"X.mean(axis=0) has shape (5,); it lines up with the last dimension and stretches over the 100 rows.","misconceptions":["Confuses axis 0 with rows: axis=0 averages down the rows, one mean per column","Expects an error: shapes (100, 5) and (5,) line up from the right","Thinks the mean is a single number: axis=0 gives one per column",""],"lo":["LO4"],"day":8,"session":1,"slide":{"deck":"week8","id":"check-broadcast","title":"Predict the shape"},"level":null,"pool":"checkpoint"},{"id":"check-float-q1","type":"single","prompt":"A test asserts Q.T @ Q == np.eye(3) for a correct QR and fails. What is wrong?","options":[{"key":"A","text":"Exact equality on floats: compare with a tolerance instead"},{"key":"B","text":"The QR routine has a bug"},{"key":"C","text":"The product should be Q @ Q.T"},{"key":"D","text":"Convert Q to float32 first"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Entries differ from 0 and 1 by about 10⁻¹⁶: correct, but not exactly equal.","misconceptions":["","Blames the factorisation: a correct Q is orthonormal only up to rounding","Thinks Q.T @ Q needs a different order: Q Qᵀ is not the identity for a tall Q","Believes float32 would fix it: fewer digits make the gap larger"],"lo":["LO4"],"day":8,"session":1,"slide":{"deck":"week8","id":"check-float","title":"Why does this test fail?"},"level":null,"pool":"checkpoint"},{"id":"mth101-p01","type":"single","prompt":"Two help articles are represented by the vectors a = (3, 4) and b = (4, 3). What is their cosine similarity?","options":[{"key":"A","text":"0.96"},{"key":"B","text":"24"},{"key":"C","text":"0.48"},{"key":"D","text":"0.75"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"a · b = 24 and ‖a‖ = ‖b‖ = 5, so the cosine is 24 / 25 = 0.96.","misconceptions":["","Takes the raw dot product as the similarity, ignoring the vectors' lengths","Divides by ‖a‖² + ‖b‖² instead of by ‖a‖ · ‖b‖","Compares one pair of components (3 / 4) instead of the whole vectors"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"mth101-p02","type":"single","prompt":"Every article vector in a search index has a large shared component, and almost every pair of articles has a cosine near 0.85. What does subtracting the mean vector before comparing do?","options":[{"key":"A","text":"It makes every vector length 1, so cosines become dot products"},{"key":"B","text":"It removes the direction every vector shares, so the cosine compares how articles differ"},{"key":"C","text":"It leaves the cosines unchanged, because cosine already ignores length"},{"key":"D","text":"It makes every cosine exactly 0"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Cosine ignores length but not a shared offset; centring removes the common direction, so similarities reflect differences between articles.","misconceptions":["Confuses centring with normalising to unit length","","Thinks cosine ignores a shared offset; it ignores scale, not translation","Expects centring to make all vectors orthogonal; it only removes their mean"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"mth101-p03","type":"single","prompt":"Attention scores are the product Q Kᵀ, where Q and K are both 1,024 × 64. Counting a multiply and an add as two operations, about how many floating-point operations does it take?","options":[{"key":"A","text":"About 67 million"},{"key":"B","text":"About 8.4 million"},{"key":"C","text":"About 134 million (2 × 1,024 × 1,024 × 64)"},{"key":"D","text":"About 1 million"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The result has 1,024 × 1,024 entries and each is a 64-term dot product: 64 multiplies and 64 adds.","misconceptions":["Counts only the multiplications, not the additions","Computes the 64 × 64 product Kᵀ Q, a different matrix (2 × 64 × 64 × 1,024)","","Counts the entries of the result, not the work for each entry"],"lo":["LO1"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"mth101-p04","type":"single","prompt":"Project y = (2, 3) onto the line through u = (1, 1). What is the projection?","options":[{"key":"A","text":"(5, 5)"},{"key":"B","text":"(−0.5, 0.5)"},{"key":"C","text":"(2, 3)"},{"key":"D","text":"(2.5, 2.5)"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"p = (y · u / u · u) u = (5 / 2)(1, 1) = (2.5, 2.5).","misconceptions":["Multiplies u by y · u without dividing by u · u","Gives the residual y − p, the part left after projecting","Thinks a vector projects onto any line unchanged",""],"lo":["LO1"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"mth101-p05","type":"single","prompt":"A data analyst's feature matrix has five columns. Its singular values are 2951, 89.6, 32.9, 6.0 and 0. What does the zero tell her?","options":[{"key":"A","text":"One column is an exact combination of the others, so the matrix has rank 4"},{"key":"B","text":"The fifth column is all zeros"},{"key":"C","text":"The fifth feature is unimportant for prediction"},{"key":"D","text":"The matrix has only four rows"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A zero singular value means a direction the columns cannot reach: one column is a linear combination of the others.","misconceptions":["","Reads a zero singular value as a zero column; it marks a dependent direction","Confuses a zero singular value with a weak predictor","Reads rank as the number of rows rather than independent directions"],"lo":["LO2"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"mth101-p06","type":"single","prompt":"A covariance matrix of three features has eigenvalues 4.0, 0.9 and 0.1. What share of the variance lies along the first principal component?","options":[{"key":"A","text":"4.0%"},{"key":"B","text":"80%"},{"key":"C","text":"33%"},{"key":"D","text":"98%"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Variance shares are eigenvalue / sum of eigenvalues: 4.0 / 5.0 = 0.80.","misconceptions":["Reads the eigenvalue itself as a percentage","","Assumes each of the three components holds an equal share","Adds the shares of the first two components"],"lo":["LO2"],"day":6,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"mth101-p07","type":"tf","prompt":"In link ranking with damping, the second-largest eigenvalue has size 0.85. The error of power iteration therefore shrinks by about 0.85 at each step.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Power iteration's error falls by the ratio |λ₂| / |λ₁| each step, and λ₁ = 1 here.","misconceptions":["","Thinks the speed of power iteration depends on the largest eigenvalue alone"],"lo":["LO2"],"day":6,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"mth101-p08","type":"single","prompt":"The search lead wants to store a ratings matrix at low rank and asks how much error each rank would leave. Which quantity answers that directly?","options":[{"key":"A","text":"The rank of the matrix"},{"key":"B","text":"The determinant of the matrix"},{"key":"C","text":"The singular values after the k-th: their squares sum to the squared error of the best rank-k copy"},{"key":"D","text":"The largest eigenvalue of the covariance matrix"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"By Eckart-Young, ‖A − A_k‖²_F = σ²ₖ₊₁ + … + σ²ₙ, so the tail of the singular values gives the error.","misconceptions":["Thinks the rank alone says how much a rank-k copy loses","Expects one number to describe the error at every rank; it is not even defined for a non-square matrix","","Uses only the first component, which says nothing about the tail that is dropped"],"lo":["LO2"],"day":7,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"mth101-p09","type":"single","prompt":"A least-squares fit fails with 'Singular matrix'. One column is total actions, which is the exact sum of three other columns. What fixes it?","options":[{"key":"A","text":"Rescale every column to unit variance"},{"key":"B","text":"Add more rows of the same kind"},{"key":"C","text":"Switch to 32-bit floats"},{"key":"D","text":"Drop one of the dependent columns, so the remaining columns are independent"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The columns are exactly dependent, so XᵀX is singular whatever the scale or number of rows; removing the redundant column restores full rank.","misconceptions":["Thinks scaling breaks an exact linear dependency; it does not","Expects more data to help; every new row keeps the same dependency","Thinks the failure is about precision rather than an exact dependency",""],"lo":["LO3"],"day":3,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"mth101-p10","type":"tf","prompt":"If cond(X) is 2,213, then cond(XᵀX) is about 4.9 million.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Forming XᵀX squares the condition number: 2,213² ≈ 4.9 × 10⁶.","misconceptions":["","Thinks XᵀX has the same condition number as X"],"lo":["LO3"],"day":5,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"mth101-p11","type":"single","prompt":"Two features are nearly collinear. Refitting on a slightly different sample swings their coefficients from +0.4 to −1.3, yet the predictions barely change. What is happening?","options":[{"key":"A","text":"The system is ill-conditioned: the data fix the sum of the two effects, not each one separately"},{"key":"B","text":"The solver has a bug"},{"key":"C","text":"The model needs more features"},{"key":"D","text":"The predictions must be wrong too"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Near-collinear columns leave a direction the data barely constrain: coefficients move along it while the fitted values hardly change.","misconceptions":["","Expects a correct solver to give stable coefficients on any data","Thinks adding columns helps; near-collinear columns make it worse","Assumes unstable coefficients imply unstable predictions"],"lo":["LO3"],"day":5,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"mth101-p12","type":"single","prompt":"In 64-bit arithmetic both QR and the normal equations give a coefficient of 0.4228. In 32-bit arithmetic the normal equations give 0.4308. What is the most likely cause?","options":[{"key":"A","text":"The true coefficient is 0.4308 and 64-bit arithmetic hides it"},{"key":"B","text":"Rounding error amplified by the squared condition number of XᵀX"},{"key":"C","text":"A different random seed"},{"key":"D","text":"QR is only an approximation"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"In 32-bit floats the relative error is about 10⁻⁷ times cond(XᵀX) ≈ 5 × 10⁶, enough to change the second decimal.","misconceptions":["Trusts the less precise result over the more precise one","","Looks for randomness in a deterministic computation","Thinks QR is approximate; it is exact in exact arithmetic"],"lo":["LO3"],"day":5,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"mth101-p13","type":"single","prompt":"Compute A B for A = [[1, 2], [3, 4]] and B = [[0, 1], [1, 0]].","options":[{"key":"A","text":"[[3, 4], [1, 2]]"},{"key":"B","text":"[[0, 2], [3, 0]]"},{"key":"C","text":"[[2, 1], [4, 3]]"},{"key":"D","text":"[[1, 3], [2, 4]]"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Multiplying on the right by this B swaps the columns of A.","misconceptions":["Computes B A, which swaps the rows; matrix products do not commute","Multiplies entry by entry instead of rows by columns","","Gives the transpose of A"],"lo":["LO4"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"mth101-p14","type":"single","prompt":"What is the inverse of [[2, 1], [1, 1]]?","options":[{"key":"A","text":"[[0.5, 1], [1, 1]]"},{"key":"B","text":"[[1, 1], [1, 2]]"},{"key":"C","text":"[[−1, 1], [1, −2]]"},{"key":"D","text":"[[1, −1], [−1, 2]]"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The determinant is 1, so the inverse is [[d, −b], [−c, a]] = [[1, −1], [−1, 2]]; check: the product is I.","misconceptions":["Inverts each entry separately","Swaps the diagonal but forgets to negate the off-diagonal entries","Gets the sign of the whole matrix wrong",""],"lo":["LO4"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"mth101-p15","type":"single","prompt":"What are the singular values of the diagonal matrix [[3, 0], [0, −4]]?","options":[{"key":"A","text":"4 and 3"},{"key":"B","text":"3 and −4"},{"key":"C","text":"−4 and 3"},{"key":"D","text":"7 and 1"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Singular values are the square roots of the eigenvalues of AᵀA = diag(9, 16), listed largest first: 4 and 3.","misconceptions":["","Thinks singular values can be negative and keep the diagonal's order","Sorts by value but keeps the sign","Adds and subtracts the diagonal entries"],"lo":["LO4"],"day":7,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"mth101-p16","type":"single","prompt":"A and B are NumPy arrays of shape (3, 4). Which expression gives the 3 × 3 matrix of dot products between the rows of A and the rows of B?","options":[{"key":"A","text":"A @ B"},{"key":"B","text":"A @ B.T"},{"key":"C","text":"A * B"},{"key":"D","text":"A.T @ B"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Row i of A times column j of Bᵀ (row j of B) is entry (i, j): (3, 4) @ (4, 3) gives (3, 3).","misconceptions":["Forgets that inner dimensions must match: (3, 4) @ (3, 4) fails","","Uses the element-wise product, which keeps the shape (3, 4)","Takes dot products between columns, giving a 4 × 4 matrix"],"lo":["LO4"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"mth101-p17","type":"single","prompt":"With X = Q R (Q has orthonormal columns, R is upper triangular), which system gives the least-squares coefficients β?","options":[{"key":"A","text":"β = Qᵀ y"},{"key":"B","text":"Rᵀ β = Q y"},{"key":"C","text":"R β = Qᵀ y"},{"key":"D","text":"XᵀX β = Qᵀ y"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Xᵀ X β = Xᵀ y becomes Rᵀ R β = Rᵀ Qᵀ y, and R is invertible, so R β = Qᵀ y, solved by back substitution.","misconceptions":["Forgets the triangular factor R","Transposes the wrong factors","","Mixes the normal equations with the QR right-hand side"],"lo":["LO5"],"day":5,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"mth101-p18","type":"tf","prompt":"On nearly dependent columns, modified Gram-Schmidt keeps Q as orthogonal as Householder QR does.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Modified Gram-Schmidt loses orthogonality in proportion to the condition number; Householder stays near machine precision.","misconceptions":["Thinks every QR algorithm is equally accurate because they agree in exact arithmetic",""],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"mth101-p19","type":"single","prompt":"As two features become more collinear, the gap between the normal-equation and QR coefficients grows from 10⁻¹¹ to 10⁻⁶. Which explanation fits?","options":[{"key":"A","text":"QR becomes less accurate than the normal equations"},{"key":"B","text":"It is random noise unrelated to the data"},{"key":"C","text":"Both methods are exact, so the gap is a printing artefact"},{"key":"D","text":"The normal equations' error grows with cond(X)², QR's only with cond(X)"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Forming XᵀX squares the condition number, so its rounding error grows much faster as the columns align.","misconceptions":["Reverses which method is more stable","Ignores that the gap tracks the condition number","Forgets rounding in floating-point arithmetic",""],"lo":["LO5"],"day":5,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"mth101-p20","type":"single","prompt":"Which NumPy and SciPy code solves least squares through QR?","options":[{"key":"A","text":"Q, R = np.linalg.qr(X); beta = scipy.linalg.solve_triangular(R, Q.T @ y)"},{"key":"B","text":"beta = np.linalg.solve(X.T @ X, X.T @ y)"},{"key":"C","text":"beta = np.linalg.inv(X) @ y"},{"key":"D","text":"Q, R = np.linalg.qr(X); beta = R @ Q.T @ y"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"QR least squares solves the triangular system R β = Qᵀ y.","misconceptions":["","Calls this QR; it is the normal equations","Inverts a non-square matrix, which has no inverse","Multiplies by R instead of solving with it"],"lo":["LO5"],"day":5,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"mth101-p21","type":"single","prompt":"A matrix has singular values 10, 6, 3 and 1. What is the relative error ‖A − A₂‖_F / ‖A‖_F of its best rank-2 copy?","options":[{"key":"A","text":"About 0.07"},{"key":"B","text":"About 0.26"},{"key":"C","text":"0.20"},{"key":"D","text":"0.30"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"√((3² + 1²) / (10² + 6² + 3² + 1²)) = √(10 / 146) ≈ 0.26.","misconceptions":["Forgets the square root of the ratio of squared sums","","Sums the singular values instead of their squares","Uses only the first dropped singular value over the largest one"],"lo":["LO6"],"day":7,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"mth101-p22","type":"single","prompt":"A rank-k copy of a 512 × 512 image stores k (512 + 512 + 1) numbers. From which rank does it stop saving space?","options":[{"key":"A","text":"512"},{"key":"B","text":"128"},{"key":"C","text":"256"},{"key":"D","text":"262"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"k × 1,025 ≥ 262,144 first holds at k = 256.","misconceptions":["Thinks a copy saves space until it reaches full rank","Halves the size twice without solving the inequality","","Divides 262,144 by 1,000 instead of 1,025"],"lo":["LO6"],"day":7,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"mth101-p23","type":"tf","prompt":"The first two principal components of the 8 × 8 handwritten digits hold about 28% of the variance, so a two-dimensional scatter of the digits leaves most of their spread out.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"In the lab the first two components hold 14.9% and 13.6%; 13 components are needed for 80%.","misconceptions":["","Assumes two components always capture most of the variance"],"lo":["LO6"],"day":7,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"mth101-p24","type":"single","prompt":"On held-out ratings, the error of a low-rank model is lowest at rank 3 and rises at higher ranks. Why?","options":[{"key":"A","text":"The SVD becomes inaccurate at high rank"},{"key":"B","text":"Higher ranks are always better, so the code has a bug"},{"key":"C","text":"The baseline was computed wrongly"},{"key":"D","text":"Higher ranks fit the noise in the observed ratings, which does not carry over to new ones"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Extra layers capture noise particular to the observed entries; held-out error measures generalisation.","misconceptions":["Blames the algorithm for a modelling effect","Assumes a closer fit to training data always predicts better","Looks at the reference rather than the model",""],"lo":["LO6"],"day":8,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"mth101-p25","type":"single","prompt":"A low-rank adapter replaces a full update of a 768 × 768 weight matrix by two factors of rank 8. What share of the full update's parameters does it train?","options":[{"key":"A","text":"About 2.1%"},{"key":"B","text":"About 1.0%"},{"key":"C","text":"About 8%"},{"key":"D","text":"100%"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"2 × 768 × 8 = 12,288 parameters against 768² = 589,824, which is 2.08%.","misconceptions":["","Counts only one of the two factors","Reads the rank as a percentage","Thinks the adapter still trains every weight"],"lo":["LO6"],"day":8,"session":1,"slide":null,"level":"apply","pool":"practice"}]}</script>
